name: 发布扩展安装包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出发布版本
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 核对版本与更新信息
        run: node scripts/sync-update-info.cjs --check

      - name: 构建并校验安装包
        id: build
        run: python3 scripts/build-release.py

      - name: 发布到 GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.build.outputs.version }}
          RELEASE_NAME: ${{ steps.build.outputs.name }}
          ARCHIVE: ${{ steps.build.outputs.upload_archive }}
          CHECKSUM: ${{ steps.build.outputs.upload_checksum }}
          NOTES: ${{ steps.build.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "版本标签与 info.json 不一致：$GITHUB_REF_NAME / $tag" >&2
            exit 1
          fi
          if gh release view "$tag" --json isDraft > release-state.json 2>/dev/null; then
            if [[ "$(python3 -c 'import json; print(json.load(open("release-state.json"))["isDraft"])')" != "True" ]]; then
              echo "该版本已发布；请更新版本号后再发布，避免覆盖已有安装包。" >&2
              exit 1
            fi
            gh release edit "$tag" --target "$GITHUB_SHA" --title "$RELEASE_NAME" --notes-file "$NOTES"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$RELEASE_NAME" --notes-file "$NOTES" --draft
          fi
          gh release upload "$tag" "$ARCHIVE#${RELEASE_NAME}.zip" "$CHECKSUM#${RELEASE_NAME}.zip.sha256" --clobber
          # Draft releases must be queried by their API URL, not the public tag endpoint.
          release_api_url="$(gh release view "$tag" --json apiUrl --jq .apiUrl)"
          gh api "$release_api_url" > release-assets.json
          python3 scripts/build-release.py --verify-assets release-assets.json
          gh release edit "$tag" --draft=false --latest
